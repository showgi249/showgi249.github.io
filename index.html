<!-- ==================== لوحة الإدارة المخفية ==================== -->
<div id="adminPanel" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 9999; padding: 20px; overflow-y: auto;">
  <div style="max-width: 600px; margin: 20px auto; background: linear-gradient(135deg, #1a1d24, #0f1220); border: 2px solid #7c3aed; border-radius: 16px; padding: 25px; position: relative;">
    
    <button onclick="closeAdmin()" style="position: absolute; top: 15px; left: 15px; background: #ef4444; color: #fff; border: none; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-weight: 700;">✕</button>
    
    <h2 style="color: #fff; text-align: center; margin-bottom: 20px;">🔐 لوحة الإدارة</h2>
    
    <!-- قسم الرمز (يظهر أول مرة فقط) -->
    <div id="tokenSection" style="background: #0d1017; border: 1px solid #2a2e38; border-radius: 10px; padding: 15px; margin-bottom: 20px;">
      <label style="color: #fff; display: block; margin-bottom: 8px; font-weight: 600;">🔑 رمز GitHub (يُحفظ في متصفحك فقط):</label>
      <input type="password" id="ghToken" placeholder="ghp_..." style="width: 100%; padding: 12px; background: #1a1d24; border: 1px solid #2a2e38; border-radius: 8px; color: #fff; font-family: monospace; margin-bottom: 10px;">
      <button onclick="saveToken()" style="background: #22c55e; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 700; width: 100%;">💾 حفظ الرمز</button>
      <button onclick="clearToken()" style="background: #ef4444; color: #fff; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: 600; width: 100%; margin-top: 8px; font-size: 0.8rem;">🗑️ حذف الرمز المحفوظ</button>
    </div>

    <!-- نموذج الإضافة -->
    <div id="addSection" style="display: none;">
      
      <!-- خيارات النوع -->
      <div style="margin-bottom: 15px;">
        <label style="color: #fff; display: block; margin-bottom: 8px; font-weight: 600;">📌 نوع الإضافة:</label>
        <select id="addType" style="width: 100%; padding: 12px; background: #0d1017; border: 1px solid #2a2e38; border-radius: 8px; color: #fff; font-family: inherit;">
          <option value="content_links">🔗 رابط محتوى (يظهر في قسم روابط المحتوى)</option>
          <option value="posts">📝 منشور (يظهر في قسم منشوراتي)</option>
        </select>
      </div>

      <!-- الرابط -->
      <div style="margin-bottom: 15px;">
        <label style="color: #fff; display: block; margin-bottom: 8px; font-weight: 600;">🌐 الرابط:</label>
        <input type="url" id="addUrl" placeholder="https://..." style="width: 100%; padding: 12px; background: #0d1017; border: 1px solid #2a2e38; border-radius: 8px; color: #fff; font-family: inherit;">
      </div>

      <!-- العنوان -->
      <div style="margin-bottom: 15px;">
        <label style="color: #fff; display: block; margin-bottom: 8px; font-weight: 600;">📝 العنوان:</label>
        <input type="text" id="addTitle" placeholder="عنوان المحتوى" style="width: 100%; padding: 12px; background: #0d1017; border: 1px solid #2a2e38; border-radius: 8px; color: #fff; font-family: inherit;">
      </div>

      <!-- زر النشر -->
      <button onclick="publishLink()" id="publishBtn" style="background: linear-gradient(135deg, #7c3aed, #06b6d4); color: #fff; border: none; padding: 14px; border-radius: 10px; cursor: pointer; font-weight: 800; width: 100%; font-size: 1rem; font-family: inherit;">🚀 نشر الرابط</button>
      
      <div id="adminStatus" style="color: #94a3b8; font-size: 0.85rem; text-align: center; margin-top: 12px; min-height: 20px;"></div>

      <hr style="border-color: #2a2e38; margin: 20px 0;">

      <p style="color: #94a3b8; font-size: 0.8rem; text-align: center;">
        الرمز محفوظ في متصفحك فقط، ولا يظهر لأي زائر آخر.
      </p>
    </div>
  </div>
</div>

<script>
/* ==================== إدارة GitHub API ==================== */
const GH_OWNER = 'showgi249';
const GH_REPO = 'showgi249.github.io';
const GH_FILE = 'content.json';
const GH_BRANCH = 'main';

// التحقق من وضع الأدمن
function isAdminMode() {
  return new URLSearchParams(window.location.search).get('admin') === '1';
}

// فتح لوحة الإدارة
function openAdmin() {
  const panel = document.getElementById('adminPanel');
  if (!panel) return;
  panel.style.display = 'block';

  const token = localStorage.getItem('gh_token');
  if (token) {
    document.getElementById('ghToken').value = token;
    document.getElementById('tokenSection').style.display = 'none';
    document.getElementById('addSection').style.display = 'block';
  } else {
    document.getElementById('tokenSection').style.display = 'block';
    document.getElementById('addSection').style.display = 'none';
  }
}

// إغلاق لوحة الإدارة
function closeAdmin() {
  document.getElementById('adminPanel').style.display = 'none';
  // إزالة admin=1 من الرابط
  const url = new URL(window.location.href);
  url.searchParams.delete('admin');
  window.history.replaceState({}, '', url);
}

// حفظ الرمز
function saveToken() {
  const token = document.getElementById('ghToken').value.trim();
  if (!token.startsWith('ghp_') && !token.startsWith('github_pat_')) {
    alert('⚠️ الرمز غير صحيح. يجب أن يبدأ بـ ghp_ أو github_pat_');
    return;
  }
  localStorage.setItem('gh_token', token);
  document.getElementById('tokenSection').style.display = 'none';
  document.getElementById('addSection').style.display = 'block';
  showStatus('✅ تم حفظ الرمز بنجاح', '#22c55e');
}

// حذف الرمز
function clearToken() {
  if (!confirm('هل أنت متأكد من حذف الرمز؟')) return;
  localStorage.removeItem('gh_token');
  document.getElementById('ghToken').value = '';
  document.getElementById('tokenSection').style.display = 'block';
  document.getElementById('addSection').style.display = 'none';
  showStatus('🗑️ تم حذف الرمز', '#ef4444');
}

// عرض رسالة الحالة
function showStatus(msg, color) {
  const el = document.getElementById('adminStatus');
  if (el) {
    el.textContent = msg;
    el.style.color = color || '#94a3b8';
  }
}

// جلب محتوى content.json من GitHub
async function fetchContentJson() {
  const url = `https://raw.githubusercontent.com/${GH_OWNER}/${GH_REPO}/${GH_BRANCH}/${GH_FILE}?t=${Date.now()}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('فشل جلب الملف');
  return await res.json();
}

// تحديث content.json على GitHub
async function updateContentJson(newData, token) {
  const apiUrl = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_FILE}`;

  // 1. جلب SHA الحالي
  const getRes = await fetch(apiUrl, {
    headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github+json' }
  });
  if (!getRes.ok) throw new Error('فشل الاتصال بـ GitHub. تأكد من الرمز.');
  const fileData = await getRes.json();

  // 2. تحويل البيانات إلى Base64 (دعم UTF-8)
  const jsonStr = JSON.stringify(newData, null, 2);
  const base64Content = btoa(unescape(encodeURIComponent(jsonStr)));

  // 3. تحديث الملف
  const updateRes = await fetch(apiUrl, {
    method: 'PUT',
    headers: {
      'Authorization': `token ${token}`,
      'Accept': 'application/vnd.github+json',
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      message: 'إضافة رابط جديد من لوحة الإدارة',
      content: base64Content,
      sha: fileData.sha,
      branch: GH_BRANCH
    })
  });

  if (!updateRes.ok) {
    const err = await updateRes.json();
    throw new Error(err.message || 'فشل التحديث');
  }
  return true;
}

// نشر رابط جديد
async function publishLink() {
  const token = localStorage.getItem('gh_token');
  if (!token) { alert('⚠️ الرمز غير محفوظ.'); return; }

  const type = document.getElementById('addType').value;
  const url = document.getElementById('addUrl').value.trim();
  const title = document.getElementById('addTitle').value.trim();

  if (!url || !url.startsWith('http')) {
    alert('⚠️ أدخل رابطاً صحيحاً يبدأ بـ http');
    return;
  }

  const btn = document.getElementById('publishBtn');
  btn.disabled = true;
  btn.textContent = '⏳ جاري النشر...';
  showStatus('⏳ جاري النشر...', '#94a3b8');

  try {
    // 1. جلب المحتوى الحالي
    const data = await fetchContentJson();

    // 2. إضافة الرابط
    if (!Array.isArray(data[type])) data[type] = [];
    data[type].unshift({
      url: url,
      title: title || 'محتوى جديد',
      date: new Date().toISOString()
    });
    data.updated_at = new Date().toISOString();

    // 3. تحديث على GitHub
    await updateContentJson(data, token);

    showStatus('✅ تم النشر! سيظهر خلال دقيقة.', '#22c55e');
    document.getElementById('addUrl').value = '';
    document.getElementById('addTitle').value = '';

    // 4. إعادة تحميل البطاقات بعد 60 ثانية (انتظار النشر من GitHub Pages)
    setTimeout(() => location.reload(), 60000);
  } catch (err) {
    showStatus('❌ ' + err.message, '#ef4444');
    console.error(err);
  } finally {
    btn.disabled = false;
    btn.textContent = '🚀 نشر الرابط';
  }
}

// تفعيل لوحة الأدمن إذا كان الرابط يحتوي على ?admin=1
document.addEventListener('DOMContentLoaded', function() {
  if (isAdminMode()) {
    setTimeout(openAdmin, 500);
  }
});

// إغلاق اللوحة بزر Escape
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeAdmin();
});
</script>
