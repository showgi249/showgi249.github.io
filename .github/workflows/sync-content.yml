name: Sync SHOWGI249 Content

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: sync-content
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: تحميل المستودع
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: إعداد Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: تثبيت المتطلبات
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: مزامنة المحتوى
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_HANDLE: showgi249
          TELEGRAM_CHANNEL: showgi249
        run: python sync_content.py

      - name: حفظ المحتوى المحدث
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase
          git add content.json
          if git diff --cached --quiet; then
            echo "ℹ️ لا توجد تغييرات."
          else
            git commit -m "chore: update SHOWGI249 content [skip ci]"
            git push origin main
          fi